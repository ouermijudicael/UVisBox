name: uvisbox
channels:
  - conda-forge
  - defaults
dependencies:
  - python >=3.11,<3.14
  - numpy >=2.0,<3.0.0
  - scipy >=1.16.1,<2.0.0
  - matplotlib >=3.10.5,<4.0.0
  - scikit-learn >=1.7.1,<2.0.0
  - scikit-image >=0.25.2,<0.26.0
  - pyvista >=0.47.1,<0.48.0
  - trame >=2.5.2
  - trame-client >=2.12.7
  - trame-server >=2.11.7
  - trame-vtk >=2.5.8
  - trame-vuetify >=2.3.1
  - ipywidgets
  - jupyter-server-proxy
  - nest-asyncio2
  - basemap >=2.0.0,<2.1.0
  - xarray >=2026.2.0,<2027.0.0
  - cartopy >=0.25.0,<0.26.0
  - numba >=0.62.1
  - joblib >=1.5.2
  - pip
  - pip:
    - dsapi >=0.6b0,<0.7
