# =============================================================================
# Repository Traffic Data Collection Workflow
# =============================================================================
# Purpose: Automatically collect GitHub repository traffic analytics data
# Schedule: Runs daily at midnight UTC
# Output: Saves data to dedicated 'traffic_data' branch (keeps main branch clean)
# =============================================================================

name: Repository Traffic Data Collection

on:
  schedule:
    # Run daily at midnight UTC to collect previous day's traffic data
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggering for testing and immediate collection

jobs:
  collect-traffic-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push to the traffic_data branch
    
    steps:
    # -------------------------------------------------------------------------
    # STEP 1: Checkout the repository with full history
    # -------------------------------------------------------------------------
    # - Uses Personal Access Token (PAT) if available for better permissions
    # - Falls back to default GITHUB_TOKEN if PAT not configured
    # - fetch-depth: 0 ensures we get full git history for branch operations
    # -------------------------------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{secrets.UVisBox_TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    # -------------------------------------------------------------------------
    # STEP 2: Set up Python environment
    # -------------------------------------------------------------------------
    # - Uses Python 3.9 for stability and compatibility
    # - Required for running the traffic data collection script
    # -------------------------------------------------------------------------
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # -------------------------------------------------------------------------
    # STEP 3: Install required Python packages
    # -------------------------------------------------------------------------
    # - requests: For making HTTP API calls to GitHub
    # - PyGithub: Official GitHub API library for Python
    # -------------------------------------------------------------------------
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests PyGithub

    # -------------------------------------------------------------------------
    # STEP 4: Create temporary traffic_data directory
    # -------------------------------------------------------------------------
    # - Creates directory in main branch (temporarily)
    # - Will be moved to traffic_data branch and cleaned up from main later
    # -------------------------------------------------------------------------
    - name: Create traffic_data directory
      run: mkdir -p traffic_data

    # -------------------------------------------------------------------------
    # STEP 5: Collect repository traffic data using GitHub API
    # -------------------------------------------------------------------------
    # - Collects 4 types of data: views, clones, referrers, popular paths
    # - Uses Personal Access Token for elevated permissions (traffic data requires repo scope)
    # - Handles API errors gracefully and logs them in the output files
    # - Creates both daily snapshot and rolling summary files
    # -------------------------------------------------------------------------
    - name: Collect repository traffic data
      env:
        GITHUB_TOKEN: ${{secrets.UVisBox_TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
        REPOSITORY: ${{ github.repository }}
      run: |
        python << 'EOF'
        import os
        import json
        import requests
        from datetime import datetime, timezone
        from github import Github

        # Initialize GitHub API client
        token = os.environ['GITHUB_TOKEN']
        repo_name = os.environ['REPOSITORY']
        
        # Token validation: Traffic data APIs require Personal Access Token with 'repo' scope
        # Default GITHUB_TOKEN (ghs_*) lacks permissions for traffic data
        if token.startswith('ghs_'):
            print("⚠️  Using default GITHUB_TOKEN - this may not have traffic data permissions")
            print("   Consider setting up a Personal Access Token with 'repo' scope as UVisBox_TRAFFIC_TOKEN secret")
        else:
            print("✅ Using Personal Access Token for traffic data access")
        
        g = Github(token)
        repo = g.get_repo(repo_name)

        # Generate timestamps for data organization
        timestamp = datetime.now(timezone.utc).isoformat()
        date_str = datetime.now(timezone.utc).strftime('%Y-%m-%d')

        # Initialize traffic data structure
        traffic_data = {
            'timestamp': timestamp,
            'date': date_str,
            'repository': repo_name,
            'data': {}
        }

        # =====================================================================
        # DATA COLLECTION: Views (Repository page views - past 14 days)
        # =====================================================================
        try:
            views = repo.get_views_traffic(per='day')
            traffic_data['data']['views'] = {
                'count': views.count,        # Total views in the period
                'uniques': views.uniques,    # Unique visitors
                'views': [{'timestamp': view.timestamp.isoformat(), 'count': view.count, 'uniques': view.uniques} for view in views.views]
            }
            print(f"✅ Views data collected: {views.count} total views, {views.uniques} unique visitors")
        except Exception as e:
            print(f"❌ Error collecting views data: {e}")
            traffic_data['data']['views'] = {'error': str(e)}

        # =====================================================================
        # DATA COLLECTION: Clones (Repository clones - past 14 days) 
        # =====================================================================
        try:
            clones = repo.get_clones_traffic(per='day')
            traffic_data['data']['clones'] = {
                'count': clones.count,       # Total clones in the period
                'uniques': clones.uniques,   # Unique cloners
                'clones': [{'timestamp': clone.timestamp.isoformat(), 'count': clone.count, 'uniques': clone.uniques} for clone in clones.clones]
            }
            print(f"✅ Clones data collected: {clones.count} total clones, {clones.uniques} unique cloners")
        except Exception as e:
            print(f"❌ Error collecting clones data: {e}")
            traffic_data['data']['clones'] = {'error': str(e)}

        # =====================================================================
        # DATA COLLECTION: Referrers (Top traffic sources)
        # =====================================================================
        try:
            referrers = repo.get_top_referrers()
            traffic_data['data']['referrers'] = [
                {
                    'referrer': ref.referrer,  # Source website/domain
                    'count': ref.count,        # Total visits from this source
                    'uniques': ref.uniques     # Unique visitors from this source
                } for ref in referrers
            ]
            print(f"✅ Referrers data collected: {len(referrers)} referral sources")
        except Exception as e:
            print(f"❌ Error collecting referrers data: {e}")
            traffic_data['data']['referrers'] = {'error': str(e)}

        # =====================================================================
        # DATA COLLECTION: Popular Paths (Most visited repository paths)
        # =====================================================================
        try:
            paths = repo.get_top_paths()
            traffic_data['data']['popular_paths'] = [
                {
                    'path': path.path,         # Repository path (e.g., /README.md)
                    'title': path.title,       # Page title
                    'count': path.count,       # Total visits to this path
                    'uniques': path.uniques    # Unique visitors to this path
                } for path in paths
            ]
            print(f"✅ Popular paths data collected: {len(paths)} paths tracked")
        except Exception as e:
            print(f"❌ Error collecting popular paths data: {e}")
            traffic_data['data']['popular_paths'] = {'error': str(e)}

        # Save data to file
        filename = f"traffic_data/traffic_{date_str}.json"
        with open(filename, 'w') as f:
            json.dump(traffic_data, f, indent=2, default=str)
        
        print(f"Traffic data saved to {filename}")

        # Also create/update a summary file with latest data
        summary_file = "traffic_data/last_90_days_summary.json"
        summary_data = {
            'last_updated': timestamp,
            'repository': repo_name,
            'latest_data': traffic_data['data']
        }
        
        with open(summary_file, 'w') as f:
            json.dump(summary_data, f, indent=2, default=str)
        
        print(f"Summary data saved to {summary_file}")
        EOF

    - name: Commit and push traffic data to traffic_data branch
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Check if traffic_data branch exists remotely
        if git ls-remote --heads origin traffic_data | grep -q traffic_data; then
          echo "traffic_data branch exists, checking it out"
          git fetch origin traffic_data
          git checkout traffic_data
        else
          echo "Creating new traffic_data branch"
          git checkout --orphan traffic_data
          # Remove all files except traffic_data directory for the orphan branch
          git rm -rf . 2>/dev/null || true
          # Add a README for the traffic_data branch
          echo "# Traffic Data Branch" > README.md
          echo "" >> README.md
          echo "This branch contains automated traffic data collection for the UVisBox repository." >> README.md
          echo "" >> README.md
          echo "## Data Structure" >> README.md
          echo "- \`traffic_data/traffic_YYYY-MM-DD.json\`: Daily traffic data files" >> README.md
          echo "- \`traffic_data/last_90_days_summary.json\`: Rolling 90-day traffic summary" >> README.md
          echo "" >> README.md
          echo "Data is automatically updated daily at midnight UTC via GitHub Actions." >> README.md
          git add README.md
        fi
        
        # Add traffic data
        git add traffic_data/
        
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "📈 Update traffic data - $(date -u +%Y-%m-%d)"
          git push origin traffic_data
          echo "Traffic data committed and pushed to traffic_data branch"
        fi
        
        # Switch back to main branch and clean up traffic_data directory
        git checkout main
        if [ -d "traffic_data" ]; then
          rm -rf traffic_data
          echo "Cleaned up traffic_data directory from main branch"
        fi

    - name: Create traffic data summary
      run: |
        if [ -f "traffic_data/last_90_days_summary.json" ]; then
          echo "## Repository Traffic Summary" >> $GITHUB_STEP_SUMMARY
          echo "Traffic data collected on $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          
          # Extract key metrics from the summary file
          python << 'EOF'
        import json
        import os
        
        try:
            with open('traffic_data/last_90_days_summary.json', 'r') as f:
                data = json.load(f)
            
            summary_lines = []
            
            if 'views' in data['latest_data'] and 'error' not in data['latest_data']['views']:
                views = data['latest_data']['views']
                summary_lines.append(f"- **Views**: {views['count']} total ({views['uniques']} unique)")
            
            if 'clones' in data['latest_data'] and 'error' not in data['latest_data']['clones']:
                clones = data['latest_data']['clones']
                summary_lines.append(f"- **Clones**: {clones['count']} total ({clones['uniques']} unique)")
            
            if 'referrers' in data['latest_data'] and 'error' not in data['latest_data']['referrers']:
                referrers = data['latest_data']['referrers']
                summary_lines.append(f"- **Top Referrers**: {len(referrers)} sources")
            
            if 'popular_paths' in data['latest_data'] and 'error' not in data['latest_data']['popular_paths']:
                paths = data['latest_data']['popular_paths']
                summary_lines.append(f"- **Popular Paths**: {len(paths)} paths tracked")
            
            if summary_lines:
                with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                    f.write('\n'.join(summary_lines) + '\n')
                    f.write(f"\nData updated: {data['last_updated']}\n")
        except Exception as e:
            print(f"Error creating summary: {e}")
        EOF
        fi
