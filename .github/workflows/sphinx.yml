name: Deploy Sphinx Docs to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx
          pip install sphinx-rtd-theme
          pip install sphinx-autodoc-typehints  # For type hints in signatures
          pip install sphinx-autoapi  # For better handling of submodules
      - name: Build Sphinx documentation
        run: |
          cd docs
          sphinx-apidoc -o source/ ../uvisbox
          sphinx-build -b html source build/html
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }} # Deploy only on push to main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html # Directory containing the built HTML documentation
          publish_branch: gh-pages # Branch where GitHub Pages will be served from
          # force_orphan: true # Optional: Create a fresh gh-pages branch each time
