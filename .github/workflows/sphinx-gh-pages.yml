name: Deploy Sphinx Docs to GitHub Pages

on:
  push:
    branches: ["main"]   # or your default branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # or your version

      - name: Setup virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Install essential dependencies for documentation
          pip install numpy scipy scikit-learn scikit-image matplotlib sphinx sphinx-rtd-theme
          # Install package without heavy dependencies (pyvista, basemap will be mocked)
          pip install -e . --no-deps

      - name: Build documentation
        env:
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: true
          DISPLAY: ":99.0"
          SPHINX_BUILD: "1"
        run: |
          # Start virtual display
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          cd docs
          sphinx-build -b html source/ build/html/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
